<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZX-6R — new photo batch</title>
<style>
  :root{--pit:#0a0f0d;--panel:#0e1a16;--emerald:#0e2b24;--sheen:#3fae8c;--sheen-dim:#2a7560;
        --ivory:#efe8d6;--dim:#b6ae9c;--faint:#7e7a6d;--line:#1c332c;--brass:#d8b46a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--pit);color:var(--ivory);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
       font-size:15px;line-height:1.5;padding:26px 20px 130px}
  .wrap{max-width:1080px;margin:0 auto}
  h1{font-size:25px;letter-spacing:.01em;margin-bottom:4px}
  .sub{color:var(--faint);font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.1em;
       text-transform:uppercase;margin-bottom:22px}
  input,textarea,button{font-family:inherit;font-size:14px;color:var(--ivory);
        background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  textarea:focus,input:focus{outline:none;border-color:var(--sheen-dim)}
  button{cursor:pointer;background:none;transition:border-color .15s,color .15s,background .15s}
  button:hover{border-color:var(--sheen-dim);color:var(--ivory)}
  button.go{background:var(--sheen);color:var(--pit);border-color:var(--sheen);font-weight:600;
            padding:12px 26px;font-size:15px}
  button.go:hover{filter:brightness(1.08);color:var(--pit)}

  .grp{border:1px solid var(--line);border-radius:13px;background:var(--panel);
       padding:15px 16px 16px;margin-bottom:14px}
  .grp-top{display:flex;align-items:center;gap:10px;margin-bottom:11px;flex-wrap:wrap}
  .grp-when{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.13em;
            text-transform:uppercase;color:var(--faint)}
  .grp-n{font-family:ui-monospace,monospace;font-size:10px;color:var(--sheen)}
  .mini{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.1em;
        text-transform:uppercase;padding:6px 11px;border-radius:999px;color:var(--dim)}
  .grp-top .mini{margin-left:auto}
  textarea.cap{width:100%;min-height:54px;resize:vertical;line-height:1.45;margin-bottom:11px}
  .shots{display:flex;gap:9px;flex-wrap:wrap}
  .shot{position:relative;width:150px;border-radius:9px;overflow:hidden;background:#060a09;
        border:1px solid var(--line)}
  .shot img{width:100%;height:112px;object-fit:cover;display:block}
  .shot .none{height:112px;display:flex;align-items:center;justify-content:center;
              color:var(--faint);font-family:ui-monospace,monospace;font-size:10px}
  .shot .meta{padding:6px 8px;font-family:ui-monospace,monospace;font-size:9px;
              color:var(--faint);display:flex;justify-content:space-between;gap:6px}
  .shot .meta .warn{color:var(--brass)}
  .split{position:absolute;top:6px;right:6px;background:rgba(10,15,13,.82);border:1px solid var(--line);
         border-radius:7px;font-family:ui-monospace,monospace;font-size:8.5px;letter-spacing:.08em;
         text-transform:uppercase;padding:4px 7px;color:var(--dim);opacity:0;transition:opacity .15s}
  .shot:hover .split,.shot:focus-within .split{opacity:1}
  @media (hover:none){ .split{opacity:1} }

  .foot{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--pit) 36%);
        padding:30px 20px 20px;display:flex;justify-content:center;gap:12px;align-items:center}
  .foot .count{font-family:ui-monospace,monospace;font-size:11px;color:var(--faint)}
  .done{border:1px solid var(--sheen-dim);border-radius:13px;background:var(--emerald);
        padding:20px 22px;margin-bottom:20px;display:none}
  .done.on{display:block}
  .done h2{font-size:17px;margin-bottom:6px}
  .done p{color:var(--dim);font-size:13.5px}
  code{font-family:ui-monospace,monospace;background:rgba(0,0,0,.35);padding:2px 6px;border-radius:4px;
       color:var(--sheen);font-size:12.5px}
  @media (max-width:560px){
    body{padding:20px 14px 130px}
    .shot{width:calc(50% - 5px)}
    .shot img,.shot .none{height:96px}
  }
</style></head>
<body><div class="wrap">
  <h1>New batch for the build log</h1>
  <div class="sub" id="sub"></div>

  <div class="done" id="done">
    <h2>Sent ✓</h2>
    <p>The manifest is on your clipboard and downloaded as <code>zx6r-intake.json</code>.
       Tell Claude <em>"the batch is ready"</em> — it decides where each shot belongs and
       handles the rest.</p>
  </div>

  <div id="groups"></div>
</div>

<div class="foot">
  <span class="count" id="count"></span>
  <button type="button" class="go" id="submit">Submit batch</button>
</div>

<script>
const ITEMS = /*__ITEMS__*/;
const GAP_MIN = 45;                      // a longer pause than this starts a new group
const host = document.getElementById("groups");

/* photos shot around the same time almost always belong together, so the
   batch arrives pre-grouped and you just describe each cluster. */
let groups = [];
(function seed(){
  let cur = null;
  ITEMS.forEach(it => {
    const t = it.taken ? Date.parse(it.taken.replace(" ", "T")) : NaN;
    if (cur && !isNaN(t) && !isNaN(cur.last) && (t - cur.last) / 60000 <= GAP_MIN) {
      cur.items.push(it); cur.last = t;
    } else {
      cur = { items: [it], last: t, caption: "" };
      groups.push(cur);
    }
  });
})();

function when(g){
  const ds = [...new Set(g.items.map(i => i.date))];
  const times = g.items.map(i => (i.taken || "").slice(11, 16)).filter(Boolean);
  let s = ds.join(" – ");
  if (times.length) s += " · " + times[0] + (times.length > 1 ? "–" + times[times.length - 1] : "");
  return s;
}
function draw(){
  host.innerHTML = "";
  groups.forEach((g, gi) => {
    const el = document.createElement("div");
    el.className = "grp";
    el.innerHTML =
      `<div class="grp-top">
         <span class="grp-when">${when(g)}</span>
         <span class="grp-n">${g.items.length} shot${g.items.length === 1 ? "" : "s"}</span>
         ${gi > 0 ? `<button type="button" class="mini up">⇈ merge up</button>` : ""}
       </div>
       <textarea class="cap" placeholder="what are these?"></textarea>
       <div class="shots"></div>`;
    const ta = el.querySelector(".cap");
    ta.value = g.caption;
    ta.addEventListener("input", e => { g.caption = e.target.value; tally(); });
    const up = el.querySelector(".up");
    if (up) up.addEventListener("click", () => {
      const prev = groups[gi - 1];
      prev.items = prev.items.concat(g.items);
      prev.caption = prev.caption || g.caption;
      groups.splice(gi, 1); draw(); tally();
    });
    const shots = el.querySelector(".shots");
    g.items.forEach((it, ii) => {
      const s = document.createElement("div");
      s.className = "shot";
      s.innerHTML =
        (it.preview ? `<img src="${it.preview}" alt="">` : `<div class="none">no preview</div>`) +
        (ii > 0 ? `<button type="button" class="split">split here</button>` : "") +
        `<div class="meta"><span>${it.kind}</span>
           <span class="${it.fallback ? "warn" : ""}">${it.date}${it.fallback ? " ~" : ""}</span></div>`;
      const sp = s.querySelector(".split");
      if (sp) sp.addEventListener("click", () => {
        const moved = g.items.splice(ii);
        groups.splice(gi + 1, 0, { items: moved, last: g.last, caption: "" });
        draw(); tally();
      });
      shots.appendChild(s);
    });
    host.appendChild(el);
  });
}
function tally(){
  const done = groups.filter(g => g.caption.trim()).length;
  document.getElementById("count").textContent =
    `${done} of ${groups.length} group${groups.length === 1 ? "" : "s"} described`;
}
document.getElementById("submit").onclick = async () => {
  const items = [];
  groups.forEach(g => g.items.forEach(it => items.push({
    file: it.file, date: it.date, dateFromFile: it.fallback,
    taken: it.taken || null, kind: it.kind, caption: g.caption.trim()
  })));
  const txt = JSON.stringify({ created: new Date().toISOString(), items }, null, 2);
  try { await navigator.clipboard.writeText(txt); } catch (e) {}
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt], { type: "application/json" }));
  a.download = "zx6r-intake.json";
  a.click();
  document.getElementById("done").classList.add("on");
  window.scrollTo({ top: 0, behavior: "smooth" });
};
document.getElementById("sub").textContent =
  `${ITEMS.length} file${ITEMS.length === 1 ? "" : "s"} · grouped by when they were taken — describe each group, split or merge if I guessed wrong`;
draw(); tally();
</script></body></html>
